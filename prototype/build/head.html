<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>셈하루 (Copy)</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Nunito:wght@600;800&display=swap">
<style>
/* 레이아웃: 당근색 앱바 + 둥근 카드 쌓기(조안호 연산 구조 + 학습현황 카드 디자인), 흰 바탕·민트그린·검정. 의도적 라이트 단일 테마 */
:root{
  color-scheme:light;
  --bg:#F3F7F5; --paper:#FFFFFF; --hi:#E7EEEA; --line:#DFE7E2;
  --k:#1E2421; --fg:#1E2421; --sub:#56605B; --dim:#87918C; --on:#FFFFFF;
  --y:#0FA37F; --y2:#2FC29A; --y-soft:#E2F5EE;
  --good:#16884A; --red:#E0353F; --orange:#C76A00;
  --shadow:0 6px 18px rgba(17,17,17,.07);
  --f:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
html,body{height:100%}
body{background:#E6ECE8;color:var(--fg);font-family:var(--f);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:2px solid var(--k);outline-offset:2px}
button:disabled{cursor:default}
h1,h2,h3,p{margin:0}
.app{max-width:440px;margin:0 auto;background:var(--bg);border-radius:24px;display:flex;flex-direction:column;overflow:hidden;min-height:100%;border:1px solid var(--line)}
/* 앱바 */
#bar{background:var(--y);color:var(--on);display:grid;grid-template-columns:72px 1fr 72px;align-items:center;height:56px;padding:0 8px;position:sticky;top:0;z-index:5}
#bar h1{font-size:17px;font-weight:900;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bb{height:40px;min-width:40px;display:flex;align-items:center;justify-content:center;border-radius:12px}
.bb:last-child{justify-self:end}
.bb svg{width:24px;height:24px;stroke:var(--k);fill:none;stroke-width:2.4}
.bb.who{background:var(--k);color:var(--y);font-size:13px;font-weight:900;padding:0 10px;gap:4px;justify-self:start}
.bb.who small{font-weight:500;color:#fff;font-size:11px}
.qmark{width:30px;height:30px;border-radius:50%;background:var(--k);display:grid;place-items:center}
#screen{flex:1;display:flex;flex-direction:column;gap:14px;padding:0 0 20px;min-width:0}
/* 홈: TODAY */
.hello{background:var(--y);color:var(--on);padding:6px 20px 22px;border-radius:0 0 28px 28px;display:flex;flex-direction:column;gap:12px}
.hello small{font-size:12px;font-weight:900;letter-spacing:.1em}
.hello h2{font-size:19px;font-weight:900;letter-spacing:-.02em;margin-top:-6px}
.bubble{align-self:flex-start;background:var(--paper);color:var(--fg);border-radius:16px 16px 16px 4px;padding:8px 14px;font-size:13px;font-weight:500;box-shadow:var(--shadow)}
.stat3{color:var(--fg);display:grid;grid-template-columns:repeat(3,1fr);background:var(--paper);border-radius:18px;padding:14px 6px;box-shadow:var(--shadow)}
.stat3 div{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.stat3 div+div{border-left:1px solid var(--line)}
.ic{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;margin-bottom:2px}
.ic svg{width:22px;height:22px;fill:none;stroke-width:2.4}
.stat3 div:nth-child(1) .ic{background:var(--k)} .stat3 div:nth-child(1) .ic svg{stroke:var(--y)}
.stat3 div:nth-child(2) .ic{background:var(--y)} .stat3 div:nth-child(2) .ic svg{stroke:var(--on)}
.stat3 div:nth-child(3) .ic{background:var(--y-soft);border:2px solid var(--k)} .stat3 div:nth-child(3) .ic svg{stroke:var(--k)}
.stat3 b{font-size:20px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stat3 small{font-size:11.5px;color:var(--sub);font-weight:500;letter-spacing:0}
.card,.box{background:var(--paper);border-radius:20px;padding:18px;margin:0 16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
.card h3,.box h3{font-size:15px;font-weight:900;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.center{align-items:center;text-align:center}
.todaycard{display:flex;flex-direction:column;gap:12px}
.todaycard h2{font-size:16px;font-weight:900;display:flex;justify-content:space-between;align-items:baseline}
.todaycard h2 small{font-size:12px;color:var(--sub);font-weight:500}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cols div{background:var(--bg);border-radius:14px;padding:10px 12px;text-align:right}
.cols small{display:block;text-align:left;font-size:12px;color:var(--sub)}
.cols b{font-size:24px;font-weight:900;font-variant-numeric:tabular-nums}
.cols b.red{color:var(--red)}
.mixline{font-size:12.5px;color:var(--sub)}
.mixline b{color:var(--k)}
.startbtn{background:var(--k);color:var(--y);border-radius:14px;padding:14px;font-size:16px;font-weight:900}
.startbtn:disabled{opacity:.35}
.now{margin:0 16px;background:var(--k);color:#fff;border-radius:20px;padding:16px 16px 16px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.now small{display:block;font-size:11.5px;color:#BDBDB5}
.now b{display:block;font-size:19px;font-weight:900;color:var(--y);margin:2px 0 8px}
.streak{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.streak i{width:12px;height:12px;border-radius:50%;border:2px solid #555}
.streak i.on{background:var(--y);border-color:var(--y)}
.streak em{font-style:normal;font-size:12px;color:#BDBDB5;margin-left:6px}
.now .qbtn .qmark{background:var(--y);width:38px;height:38px}
.areas{display:flex;gap:8px;overflow-x:auto;padding:2px 16px}
.chip{flex:none;padding:8px 14px;border-radius:999px;background:var(--paper);font-size:13px;font-weight:700;box-shadow:var(--shadow)}
.chip small{font-weight:500;color:var(--sub)}
.chip.on{background:var(--k);color:var(--y)}
.chip.on small{color:#BDBDB5}
/* 단원 목록 */
.units{list-style:none;margin:0 16px;padding:0;background:var(--paper);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.units.in{margin:0;box-shadow:none;border:1px solid var(--line)}
.units li{display:flex;align-items:center;gap:10px;padding:0 14px 0 0;border-bottom:1px solid var(--line)}
.units li:last-child{border-bottom:0}
.units li.cur{background:var(--y-soft)}
.units li.lock .unit{opacity:.45}
.unit{flex:1;min-width:0;text-align:left;padding:14px 0 14px 18px;display:flex;flex-direction:column;gap:3px}
.unit b{font-size:15px;font-weight:700}
.unit small{font-size:12px;color:var(--sub)}
.unit.static{cursor:default}
.mq{font-variant-numeric:tabular-nums}
.ansv{background:var(--y-soft);color:var(--y);font-weight:900;padding:0 6px;border-radius:4px}
.tag{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;white-space:nowrap;flex:none}
.tag.ok{background:#E3F2E9;color:var(--good)} .tag.due{background:#FDEBD2;color:var(--orange)} .tag.nowt{background:var(--k);color:var(--y)} .tag.lk{background:var(--hi);color:var(--dim)}
.tag.card,.tag.retry{background:var(--red);color:#fff} .tag.review{background:var(--k);color:var(--y)} .tag.new{background:var(--y);color:var(--on)}
.qbtn{flex:none;display:grid;place-items:center}
.x{color:var(--red);font-weight:700}
.note{font-size:12px;color:var(--sub);line-height:1.5}
#screen>.note{padding:0 20px}
/* 오답 달력 */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.cal div{border-radius:12px;padding:8px 2px;background:var(--bg)}
.cal div.t{background:var(--k);color:var(--y)}
.cal b{display:block;font-size:20px;font-weight:900;font-variant-numeric:tabular-nums}
.cal span{font-size:11px;opacity:.75}
.btn{padding:12px 18px;border-radius:14px;font-weight:700;font-size:14px;border:1px solid var(--line);background:var(--paper)}
.btn.y{background:var(--y);color:var(--on);border-color:var(--y)}
.btn.k{background:var(--k);color:#fff;border-color:var(--k)}
.btn:disabled{opacity:.35}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns.sp{justify-content:space-between}
/* 풀이 */
.np{display:flex;flex-direction:column;gap:12px;padding:14px 16px 16px;flex:1;background:var(--paper)}
.prog{display:flex;align-items:center;gap:10px}
.prog .tr{flex:1;height:10px;border-radius:5px;background:var(--hi);overflow:hidden}
.prog .tr i{display:block;height:100%;background:var(--y);transition:width .2s}
.prog span{font-size:15px;font-weight:900;font-variant-numeric:tabular-nums;min-width:58px;text-align:right}
.ptag{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--sub);justify-content:center;flex-wrap:wrap}
.toast{border-radius:14px;background:var(--k);color:var(--y);padding:10px 14px;font-weight:700;font-size:13.5px;text-align:center}
.res .toast{margin:0 16px}
.board{min-height:200px;border-radius:20px;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:30px 14px 18px;position:relative;text-align:center}
.board .q{font-size:clamp(30px,9.5vw,42px);font-weight:900;line-height:1.25;font-variant-numeric:tabular-nums;word-break:keep-all}
.board .q sup{font-size:.55em}
.board .q small{display:block;font-size:13px;font-weight:500;color:var(--sub);margin-top:6px}
.board .ans{font-size:34px;font-weight:900;min-height:48px;min-width:140px;border-bottom:3px solid var(--k);font-variant-numeric:tabular-nums;padding:0 12px}
.board .ans.empty::after{content:"?";opacity:.25}
.board.ok{box-shadow:inset 0 0 0 3px var(--good)}
.board.no{box-shadow:inset 0 0 0 3px var(--red);background:#FFF1F1}
.fb{position:absolute;top:10px;left:12px;font-size:13px;font-weight:700;border-radius:8px;padding:4px 10px}
.fb.ok{background:var(--good);color:#fff}
.fb.no{background:var(--red);color:#fff;right:12px}
.fb:empty{display:none}
.tip{font-size:12.5px;color:var(--sub);line-height:1.5;text-align:center;min-height:19px}
.tip b{color:var(--k)}
.pad{display:grid;grid-template-columns:repeat(3,1fr) 1.15fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-top:auto}
.pad button{height:58px;background:var(--paper);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.pad button:active{background:var(--hi)}
.pad .fn{background:#F1F1EB;font-size:16px;color:var(--sub)}
.pad .go{grid-column:4;grid-row:3 / span 2;height:auto;background:var(--y);color:var(--on);font-size:18px;font-weight:900}
.wrongbar{display:flex;gap:8px;margin-top:auto}
.wrongbar .btn{flex:1;padding:16px}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1;margin:0 2px;font-size:.78em}
.fr i{font-style:normal;padding:0 3px}
.fr i:first-child{border-bottom:2px solid currentColor;padding-bottom:2px}
.fr i:last-child{padding-top:2px}
/* 개념 */
.cx{display:flex;flex-direction:column;gap:14px;padding:16px;flex:1}
.steps{display:flex;gap:6px}
.steps span{flex:1;text-align:center;font-size:12px;font-weight:700;padding:7px 0;border-radius:999px;background:var(--hi);color:var(--dim)}
.steps span.on{background:var(--k);color:var(--y)}
.steps span.done{background:var(--y-soft);color:var(--y)}
.lyric{background:var(--paper);border-radius:20px;padding:22px 20px;min-height:300px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow);border-top:8px solid var(--y)}
.lyric .lk{font-size:12px;font-weight:700;color:var(--sub)}
.lyric h2{font-size:22px;font-weight:900;line-height:1.35}
.lyric p{font-size:17px;font-weight:500;line-height:1.6}
.lyric p.soft{font-size:14px;color:var(--sub)}
.lyric .ex{font-size:30px;font-weight:900;font-variant-numeric:tabular-nums;background:var(--y-soft);border-radius:12px;padding:10px 14px;align-self:flex-start}
.lyric ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:10px;font-size:16px;font-weight:700;line-height:1.5;cursor:pointer}
.lyric ol li.hide{color:var(--dim);font-weight:500}
.lyric .eqa{font-size:22px;font-weight:900;background:var(--k);color:var(--y);border-radius:10px;padding:6px 14px;align-self:flex-start}
.gate{font-size:12.5px;color:var(--sub);text-align:center}
/* 리포트 */
.seg{display:grid;grid-template-columns:repeat(3,1fr);margin:16px 16px 0;background:var(--paper);border-radius:14px;padding:4px;box-shadow:var(--shadow)}
.seg button{padding:9px 0;border-radius:10px;font-size:13px;font-weight:700;color:var(--sub)}
.seg button.on{background:var(--y);color:var(--on)}
.datenav{display:flex;align-items:center;justify-content:center;gap:16px;font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
.datenav button{width:32px;height:32px;border-radius:50%;font-size:22px;line-height:1}
.datenav button:disabled{opacity:.25}
.ring{width:180px;max-width:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;font-size:12.5px;color:var(--sub)}
.legend i{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:4px;vertical-align:-1px}
.week{display:flex;align-items:flex-end;gap:6px;height:110px;padding-top:16px}
.week.month{gap:2px}
.week div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;justify-content:flex-end;height:100%}
.week i{width:100%;max-width:24px;border-radius:5px 5px 0 0;background:var(--k);min-height:2px}
.week i.td{background:var(--y)}
.week small{font-size:11px;color:var(--sub);font-variant-numeric:tabular-nums}
.days{display:flex;gap:6px;font-size:11px;color:var(--sub)}
.days span{flex:1;text-align:center}
.hbar{display:grid;grid-template-columns:88px 1fr 40px;gap:10px;align-items:center;font-size:13px}
.hbar .tr{height:10px;border-radius:5px;background:var(--hi);overflow:hidden}
.hbar .tr i{display:block;height:100%;background:var(--y)}
.hbar .v{text-align:right;color:var(--sub);font-variant-numeric:tabular-nums}
.list div{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--hi);font-size:14px;align-items:center}
.share{margin:0 16px;padding:14px;border-radius:14px;background:#FEE500;color:#191600;font-weight:900;text-align:center}
/* 결과 + 알림 */
.res{display:flex;flex-direction:column;gap:14px;padding-top:16px}
.res>.btns{padding:0 16px}
.big{font-size:56px;font-weight:900;line-height:1;letter-spacing:-.03em;background:linear-gradient(transparent 60%,var(--y-soft) 60%);color:var(--y);padding:0 8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 16px}
.cell{background:var(--paper);border-radius:16px;padding:12px 8px;text-align:center;box-shadow:var(--shadow)}
.cell b{display:block;font-size:22px;font-weight:900;font-variant-numeric:tabular-nums}
.cell span{font-size:11.5px;color:var(--sub)}
.dim{position:fixed;inset:0;background:rgba(17,17,17,.45);display:grid;place-items:center;z-index:20;padding:24px}
.dialog{background:var(--paper);border-radius:20px;padding:22px 22px 12px;max-width:320px;width:100%;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 40px rgba(0,0,0,.25)}
.dialog h3{font-size:17px;font-weight:900}
.dialog p{font-size:14.5px;line-height:1.7;color:var(--sub)}
.dialog p b{color:var(--k)}
.dialog button{align-self:flex-end;font-weight:900;padding:10px 16px;border-radius:10px;background:var(--y);color:var(--on)}
/* 탭 */
nav{display:grid;grid-template-columns:repeat(3,1fr);padding:8px 0 calc(10px + env(safe-area-inset-bottom,0px));background:var(--paper);border-top:1px solid var(--line)}
nav button{font-size:11.5px;color:var(--dim);display:flex;flex-direction:column;align-items:center;gap:4px;position:relative;padding:4px 0}
nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.9}
nav button.on{color:var(--k);font-weight:900}
nav button.on{color:var(--y)}
nav button.on .tb{background:var(--y-soft)}
nav .tb{width:48px;height:30px;border-radius:15px;display:grid;place-items:center}
nav .dot{position:absolute;top:0;left:calc(50% + 10px);min-width:17px;height:17px;border-radius:9px;background:var(--red);color:#fff;font-size:10.5px;font-weight:900;display:grid;place-items:center;padding:0 4px}
svg.lucide{width:18px;height:18px;stroke-width:2.2;flex:none}
.btn,.startbtn,.share,.tag,.bb.who,.dialog h3,.steps span{display:inline-flex;align-items:center;justify-content:center;gap:6px}
.bb svg.lucide{width:24px;height:24px;stroke:var(--on);stroke-width:2.4}
.bb.who svg.lucide{width:16px;height:16px;stroke:var(--y)}
.bb.who svg.sm{width:14px;height:14px;stroke:#BDBDB5}
.qmark svg.lucide{width:30px;height:30px;stroke:var(--y);stroke-width:2.2}
.now .qbtn .qmark svg.lucide{stroke:var(--on);width:38px;height:38px}
.tag svg.lucide{width:12px;height:12px;stroke-width:2.6}
nav .tb svg.lucide{width:22px;height:22px}
.ic svg.lucide{width:22px;height:22px}
.pad svg.lucide{width:22px;height:22px}
.pad .fn small{font-size:12px;margin-left:2px}
.pad .go{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.pad .go svg.lucide{width:26px;height:26px;stroke-width:2.6}
.datenav svg.lucide{width:22px;height:22px}
.steps svg.lucide{width:14px;height:14px}
.tip svg.inl{width:16px;height:16px;vertical-align:-3px}
.dialog h3 svg.lucide{stroke:var(--k)}
/* ===== 당근 앱 문법 덮어쓰기: 흰 앱바, 회색 띠로 나눈 납작한 섹션, 주황은 주요 행동에만 ===== */
#bar{background:var(--paper);color:var(--fg);border-bottom:1px solid var(--line);grid-template-columns:120px 1fr 120px}
#bar>.bb:first-child{justify-self:start;min-width:40px;width:40px;padding:0}
#bar>.bb.who:first-child{width:auto;padding:0 12px}
#bar>.bb:last-child{justify-self:end;width:40px;padding:0}
.bb.who,.bb.who *{white-space:nowrap}
.bb.who{gap:5px;padding:0 12px}
.bb.who small{font-size:12px}
.areas,.pills,.row{scrollbar-width:none}
.areas::-webkit-scrollbar,.pills::-webkit-scrollbar,.row::-webkit-scrollbar{display:none}
#bar h1{font-size:16px;font-weight:700}
.bb svg.lucide{stroke:var(--fg);stroke-width:2}
.bb.who{background:var(--bg);color:var(--fg);border-radius:999px;height:34px;font-weight:700}
.bb.who svg.lucide{stroke:var(--y)} .bb.who small{color:var(--sub)} .bb.who svg.sm{stroke:var(--dim)}
#screen{gap:8px;background:var(--bg);padding-bottom:16px}
.sec{background:var(--paper);padding:18px 16px;display:flex;flex-direction:column;gap:14px}
.sec.flush{padding:18px 0 4px;gap:10px}
.sh{font-size:16px;font-weight:700;display:flex;align-items:baseline;gap:8px;margin:0}
.sh small{font-size:12.5px;color:var(--sub);font-weight:400}
.pad16{padding:0 16px}
.hrow{display:flex;align-items:center;gap:8px}
.badge{background:var(--y);color:#fff;font-size:11px;font-weight:700;border-radius:4px;padding:2px 6px;letter-spacing:.06em}
.paycard{border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px}
.pc-top{display:flex;align-items:center;gap:8px;font-size:14px}
.pc-logo{width:24px;height:24px;border-radius:50%;background:var(--y);display:grid;place-items:center}
.pc-logo svg.lucide{width:14px;height:14px;stroke:#fff;stroke-width:2.6}
.latepill{margin-left:auto;font-size:12px;font-weight:700;color:var(--y);background:var(--y-soft);border-radius:999px;padding:3px 8px}
.pc-amt{font-size:30px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.pc-amt small{font-size:18px;font-weight:500;color:var(--sub)}
.pc-btns{display:grid;grid-template-columns:1fr 1fr 1.2fr;gap:8px}
.gbtn{background:var(--bg);border-radius:8px;padding:11px 0;font-size:14px;font-weight:700}
.kbtn{background:var(--k);color:#fff;border-radius:8px;padding:11px 0;font-size:14px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.kbtn svg.lucide{width:16px;height:16px;fill:#fff}
.shortcuts{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.shortcuts button{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--fg)}
.shortcuts span{width:48px;height:48px;border-radius:50%;background:var(--bg);display:grid;place-items:center}
.shortcuts span svg.lucide{width:22px;height:22px;stroke:var(--fg);stroke-width:1.9}
.shortcuts button:first-child span{background:var(--y-soft)} .shortcuts button:first-child span svg{stroke:var(--y)}
.stat3{background:none;box-shadow:none;padding:0;border:1px solid var(--line);border-radius:12px;padding:14px 4px}
.ic{width:40px;height:40px;border-radius:12px;background:var(--bg)!important;border:0!important}
.ic svg.lucide{stroke:var(--fg)!important;width:20px;height:20px}
.stat3 b{font-size:18px;font-weight:700}
.nowrow{display:flex;align-items:center;gap:12px}
.nr-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.nr-body b{font-size:17px;font-weight:700}
.streak i{border-color:var(--line)} .streak i.on{background:var(--y);border-color:var(--y)}
.streak em{color:var(--sub)}
.lic{width:40px;height:40px;flex:none;border-radius:12px;display:grid;place-items:center;background:var(--bg)}
.lic svg.lucide{width:20px;height:20px;stroke:var(--fg);stroke-width:2}
.lic.s-now{background:var(--y)} .lic.s-now svg.lucide{stroke:#fff}
.lic.s-ok{background:var(--y-soft)} .lic.s-ok svg.lucide{stroke:var(--y)}
.lic.s-due{background:#FDEBD2} .lic.s-due svg.lucide{stroke:var(--orange)}
.lic.s-lk svg.lucide{stroke:var(--dim)}
.pillq{display:inline-flex;align-items:center;font-size:13px;font-weight:700;background:var(--bg);color:var(--fg);border-radius:6px;padding:7px 11px;white-space:nowrap}
.areas{padding:0 16px}
.chip{background:var(--bg);box-shadow:none;font-weight:500}
.chip.on{background:var(--k);color:#fff}
.units{margin:0;border-radius:0;box-shadow:none;background:var(--paper)}
.units li{padding:10px 16px;gap:12px;border-bottom:1px solid var(--line)}
.units li.cur{background:var(--paper)}
.units li.cur .unit b{color:var(--y)}
.unit{padding:0}
.tag{display:none}
.card,.box{margin:0;border-radius:0;box-shadow:none}
.units.in{border:0}
.units.in li{padding:10px 0}
.cols div{background:var(--bg)}
.startbtn{background:var(--y);color:#fff;border-radius:8px}
.toast{background:#1E2421;color:#fff;border-radius:8px;font-weight:500}
.btn{border-radius:8px}
.btn.k{background:#1E2421}
.cal div.t{background:var(--y);color:#fff}
.seg{background:var(--paper);box-shadow:none;border-radius:0;padding:0;margin:0;border-bottom:1px solid var(--line)}
.seg button{border-radius:0;padding:14px 0;font-weight:500}
.seg button.on{background:none;color:var(--fg);font-weight:700;box-shadow:inset 0 -2px 0 var(--fg)}
.datenav{background:var(--paper);padding:10px 0}
.share{margin:0 16px;border-radius:8px}
.grid3{margin:0 16px}
.cell{box-shadow:none;border:1px solid var(--line)}
nav{border-top:1px solid var(--line)}
nav button.on{color:var(--fg)}
nav button.on .tb{background:none}
nav .tb{height:26px}
nav button.on svg.lucide{stroke-width:2.4}
/* 풀이: 송금 화면처럼 */
.np{background:var(--paper);padding:12px 16px 12px}
.prog .tr i{background:var(--y)}
.prog span{font-size:13px;font-weight:700;color:var(--sub)}
.board{background:var(--paper);min-height:170px;padding:24px 8px 8px;gap:18px}
.board .ans{border-bottom:2px solid var(--y);font-size:38px;font-weight:700;min-width:180px}
.board.no{background:#FFF4F3}
.pad2{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.padtools{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.padtools button{background:var(--bg);border-radius:8px;padding:9px 0;font-size:13px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:4px}
.padtools svg.lucide{width:16px;height:16px}
.pad2 .pad{grid-template-columns:repeat(3,1fr);gap:0;background:none;border:0;border-radius:0;margin:0}
.pad2 .pad button{height:56px;background:var(--paper);font-size:24px;font-weight:500;border-radius:8px}
.pad2 .pad button:active{background:var(--bg)}
.pad2 .pad button.fn{font-size:15px;color:var(--sub);background:var(--paper)}
.pad2 .pad svg.lucide{width:24px;height:24px}
.okbtn{background:var(--y);color:#fff;border-radius:8px;padding:16px;font-size:17px;font-weight:700}
.wrongbar .btn{border-radius:8px}
.lyric{border-top:0;box-shadow:none;border:1px solid var(--line);border-radius:12px}
.steps span.on{background:var(--k);color:#fff}
.dialog{border-radius:14px}
.dialog button{border-radius:8px}
/* 난이도 표시 */
.lvl{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--bg);color:var(--sub)}
.lvl.l-쉬움{background:var(--y-soft);color:var(--y)}
.lvl.l-보통{background:#FDF1DA;color:var(--orange)}
.lvl.l-어려움{background:#FDE7E8;color:var(--red)}
.lvl.src{background:var(--k);color:#fff}
/* 앱바·하단 탭 고정, 본문만 스크롤 */
html,body{height:100%;overflow:hidden}
body{box-sizing:border-box}
.app{height:100%;min-height:0}
#bar{position:static;flex:none}
#screen{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
#screen>.np,#screen>.cx{min-height:100%}
nav{flex:none}
.steps{overflow-x:auto;scrollbar-width:none}
.steps::-webkit-scrollbar{display:none}
.steps span{flex:none;padding:7px 12px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app">
  <header id="bar"></header>
  <div id="screen"></div>
  <nav id="tabs">
    <button data-tab="home"><span class="tb"><i data-lucide="house"></i></span>연산학습</button>
    <button data-tab="cards"><span class="tb"><i data-lucide="notebook-pen"></i></span>오답노트</button>
    <button data-tab="report"><span class="tb"><i data-lucide="chart-pie"></i></span>학습결과</button>
  </nav>
</div>
