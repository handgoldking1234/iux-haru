<script>
__HGS__
window.HGS=makeHGS();
const SRC=__SRC__;
const SUBJ=[['play','홈',"<svg viewBox=\"0 0 24 24\" width=\"17\" height=\"17\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z\"/></svg>",'#DB2777','홈: 오늘 할 일과 놀이터'],['math','연산','+','#2563EB','수학 연산 셈하루'],['hanja','한자','字','#C2410C','한자 학습 한자씨앗'],['eng','영단어','A','#7C3AED','영단어 학습 영단어하루'],['hist','역사','史','#8B5A2B','역사 학습 역사하루'],['kor','국어','가','#0B8A5F','국어 학습 국어하루'],['sci','과학','科','#4F46E5','과학 학습 과학하루'],['typ','타자','⌨','#0E7490','타자 연습 타자하루']].filter(s=>SRC[s[0]]);
const topEl=document.querySelector('.top'), sw=document.getElementById('sw'), frames=document.getElementById('frames'), made={};
/* 과목 알약: 오늘 남은 문제 수를 숫자로 */
function drawPills(){ const cur=(sw.querySelector('[aria-selected="true"]')||{}).dataset; const ts=HGS.tasks();
  sw.innerHTML=SUBJ.filter(x=>x[0]!=='play').map(([k,n,ic,c])=>{ const t=ts.find(x=>x.k===k), left=t?Math.max(0,t.goal-t.n):0, on=cur&&cur.s===k;
    return `<button role="tab" data-s="${k}" aria-selected="${!!on}">${n}${left?`<em aria-label="남은 문제 ${left}">${left}</em>`:''}</button>`; }).join('');
  sw.querySelectorAll('button').forEach(b=>b.onclick=()=>show(b.dataset.s)); }
/* 과목 드롭다운 */
const ddb=document.getElementById('ddb'), ddm=document.getElementById('ddm');
function curSub(){ const b=sw.querySelector('[aria-selected="true"]'); return b?b.dataset.s:(Object.keys(made).find(k=>!made[k].hidden)||'math'); }
function drawDD(){ const cur=curSub(), ts=HGS.tasks(), it=SUBJ.find(x=>x[0]===cur)||SUBJ[1];
  document.getElementById('ddn').textContent=it[1];
  const anyLeft=ts.some(t=>t.k!==cur&&t.n<t.goal); document.getElementById('ddd').hidden=!anyLeft;
  ddm.innerHTML=SUBJ.filter(x=>x[0]!=='play').map(([k,n,ic,c])=>{ const t=ts.find(x=>x.k===k), left=t?Math.max(0,t.goal-t.n):0;
    return `<button role="option" data-s="${k}" aria-selected="${k===cur}" style="--sc:${c}"><b>${ic}</b><span>${n}</span>${t?(left?`<em>${left}문제 남음</em>`:'<i>완료</i>'):'<small>오늘 할 일 없음</small>'}${k===cur?'<svg class="ok" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>':''}</button>`; }).join('');
  ddm.querySelectorAll('button').forEach(b=>b.onclick=()=>{ closeDD(); show(b.dataset.s); }); }
function openDD(){ drawDD(); ddm.hidden=false; ddb.setAttribute('aria-expanded','true'); const o=ddm.querySelector('[aria-selected="true"]')||ddm.querySelector('button'); if(o) o.focus(); }
function closeDD(){ ddm.hidden=true; ddb.setAttribute('aria-expanded','false'); }
ddb.onclick=e=>{ e.stopPropagation(); ddm.hidden?openDD():closeDD(); };
document.addEventListener('click',e=>{ if(!ddm.hidden&&!e.target.closest('.dd')) closeDD(); });
ddm.addEventListener('keydown',e=>{ const bs=[...ddm.querySelectorAll('button')], i=bs.indexOf(document.activeElement);
  if(e.key==='Escape'){ closeDD(); ddb.focus(); } else if(e.key==='ArrowDown'){ e.preventDefault(); bs[(i+1)%bs.length].focus(); } else if(e.key==='ArrowUp'){ e.preventDefault(); bs[(i-1+bs.length)%bs.length].focus(); } });
drawPills(); drawDD(); HGS.on(()=>{ drawPills(); drawDD(); });

function show(s){
  const sub=SUBJ.find(x=>x[0]===s)||SUBJ[0]; s=sub[0];
  if(!made[s]){ const f=document.createElement('iframe'); f.title=sub[4]; f.srcdoc=SRC[s]; frames.appendChild(f); made[s]=f; }
  Object.entries(made).forEach(([k,f])=>f.hidden=k!==s);
  sw.querySelectorAll('button').forEach(b=>b.setAttribute('aria-selected',b.dataset.s===s)); const ob=sw.querySelector('[aria-selected="true"]'); if(ob) ob.scrollIntoView({block:'nearest',inline:'nearest'});
  topEl.hidden=s==='play'; if(typeof drawDD==='function') drawDD(); if(s!=='play'&&typeof SUBOFF!=='undefined'){ const w=made[s].contentWindow; if(SUBOFF.has(w)) hgSub(w,SUBOFF.get(w)); else sw2.innerHTML=''; } if(s!=='play') gnav.hidden=false; if(typeof navSel==='function') navSel();
  try{localStorage.setItem('harugongbu-subject',s); if(s!=='play') localStorage.setItem('harugongbu-study',s);}catch(e){}
}
window.goSubject=k=>show(k);
/* 탭 2: 지금 과목 안의 메뉴(학습·오답노트·학습결과) — 과목 프레임에서 알려 줌 */
const sw2=document.getElementById('sw2');
const SUBOFF=new Map();
window.hgSub=(win,off)=>{ SUBOFF.set(win,off); const cur=Object.keys(made).find(k=>!made[k].hidden); if(!cur||cur==='play'||made[cur].contentWindow!==win) return;
  const nav=win.document.getElementById('tabs'); if(!nav){ sw2.innerHTML=''; return; }
  sw2.hidden=!!off; topEl.hidden=!!off; if(off) closeDD&&closeDD();
  sw2.innerHTML=[...nav.querySelectorAll('button')].map(b=>{ const d=b.querySelector('.dot'), lab=[...b.childNodes].filter(n=>n.nodeType===3).map(n=>n.textContent).join('').trim();
    return `<button role="tab" data-t="${b.dataset.tab}" aria-selected="${b.dataset.tab===win.tab||b.classList.contains('on')}">${lab}${d?`<em>${d.textContent}</em>`:''}</button>`; }).join('');
  sw2.querySelectorAll('button').forEach(b=>b.onclick=()=>{ try{ win.subTab(b.dataset.t); }catch(e){} }); };
/* 하단 메뉴(셸 공통): 홈·공부·게임·랭킹·마이 + 숫자 */
const gnav=document.getElementById('gnav'); let playTab='home', NB={study:0,rank:0};
function ensurePlay(){ if(!made.play){ const sub=SUBJ[0]; const f=document.createElement('iframe'); f.title=sub[4]; f.srcdoc=SRC.play; f.hidden=true; frames.appendChild(f); made.play=f; } return made.play; }
function navSel(){ const cur=Object.keys(made).find(k=>!made[k].hidden)||'play'; const g=cur==='play'?playTab:'study';
  gnav.querySelectorAll('button').forEach(b=>{ if(b.dataset.g===g) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current'); }); }
function navNums(){ const ts=HGS.tasks(); NB.study=ts.reduce((a,t)=>a+Math.max(0,t.goal-t.n),0)+HGS.backTotal();
  gnav.querySelectorAll('button').forEach(b=>{ b.querySelectorAll('em').forEach(x=>x.remove()); const n=NB[b.dataset.g]; if(n>0) b.insertAdjacentHTML('beforeend',`<em>${n>999?'999+':n}${b.dataset.g==='rank'?'<span class="sr">위</span>':''}</em>`); }); }
window.hgNav=on=>{ gnav.hidden=!on; };
window.hgNavSel=t=>{ playTab=t; navSel(); };
window.hgNavBadge=o=>{ Object.assign(NB,o); navNums(); };
HGS.on(navNums);
/* 헤더 오른쪽: 알림 · 전체보기 (공부·홈·게임·랭킹·마이 공통) */
const sheet=document.getElementById('sheet'), sBody=document.getElementById('sBody'), sTitle=document.getElementById('sTitle');
let sheetBack=null;
function goPlay(t,sub){ const f=ensurePlay(); show('play'); const go=()=>{ try{ f.contentWindow.navGo(t,sub); }catch(e){} }; if(f.contentWindow&&f.contentWindow.navGo) go(); else f.addEventListener('load',go,{once:true}); }
function closeSheet(){ sheet.hidden=true; if(sheetBack){ try{ sheetBack.focus(); }catch(e){} } }
sheet.querySelectorAll('[data-x]').forEach(x=>x.onclick=closeSheet);
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&!sheet.hidden) closeSheet(); });
window.hgSheet=k=>{ sheetBack=document.activeElement;
  if(k==='menu'){ sTitle.textContent='전체보기';
    const subs=SUBJ.filter(x=>x[0]!=='play');
    sBody.innerHTML=`<div class="sgrp"><div class="sgrid"><button class="big" data-p="home">홈 · 오늘 할 일</button></div></div>
      <div class="sgrp"><h3>공부</h3><div class="sgrid">${subs.map(([k,n])=>`<button data-s="${k}">${n}</button>`).join('')}</div></div>
      <div class="sgrp"><h3>게임</h3><div class="sgrid"><button data-p="game" data-sub="speed">스피드 게임</button><button data-p="game" data-sub="room">대결방</button><button data-p="game" data-sub="set">게임 설정</button></div></div>
      <div class="sgrp"><h3>랭킹</h3><div class="sgrid"><button data-p="rank">랭킹 보기</button></div></div>
      <div class="sgrp"><h3>마이</h3><div class="sgrid"><button data-p="my" data-sub="info">내 정보</button><button data-p="my" data-sub="stats">통계</button><button data-p="my" data-sub="shop">꾸미기</button><button data-p="my" data-sub="set">설정·알림</button></div></div>`;
  } else { sTitle.textContent='알림';
    const st=HGS.st, ts=HGS.tasks(), fin=ts.filter(t=>t.n>=t.goal).length, left=ts.reduce((a,t)=>a+Math.max(0,t.goal-t.n),0), bt=HGS.backTotal(), gb=HGS.block();
    const it=(ic,t,d,go,nw)=>`<button class="nitem ${nw?'new':''}" ${go}><span class="ni" aria-hidden="true">${ic}</span><span><b>${t}</b><small>${d}</small></span></button>`;
    const L=[];
    L.push(HGS.todayDone()?it('✅','오늘 할 일 완료!','꾸미기와 게임이 열렸어요','data-p="home"'):it('📚',`오늘 할 일 ${fin}/${ts.length}`,`${left}문제 남았어요. 지금 이어서 해 볼까요?`,'data-st="1"',true));
    if(bt) L.push(it('⏰',`밀린 공부 ${bt}문제`,'오늘 할 일을 넘긴 정답으로 오래된 것부터 갚아요','data-p="home"',true));
    ts.filter(t=>t.n<t.goal).forEach(t=>L.push(it('✏️',`${t.name} ${t.goal-t.n}문제 남음`,`${t.n}/${t.goal} 맞혔어요`,`data-s="${t.k}"`)));
    L.push(it('🎮',gb?'게임 잠김':`게임 ${HGS.left()}판 남음`,gb?gb.msg:'스피드 게임이나 대결방에서 쓸 수 있어요','data-p="game"'));
    (st.alarms||[]).filter(a=>a.on).forEach(a=>L.push(it('🔔',`${a.t} ${a.label||'공부할 시간'}`,'정해 둔 시간에 알려 줘요 · 바꾸기','data-p="my" data-sub="set"')));
    sBody.innerHTML=`<div class="nlist">${L.join('')}</div>`;
  }
  sBody.querySelectorAll('button').forEach(b=>b.onclick=()=>{ closeSheet();
    if(b.dataset.s) show(b.dataset.s); else if(b.dataset.st) goStudy(); else if(b.dataset.p) goPlay(b.dataset.p,b.dataset.sub); });
  sheet.hidden=false; setTimeout(()=>{ const x=sheet.querySelector('.shd .hb'); if(x) x.focus(); },30);
};
document.getElementById('sNoti').onclick=()=>hgSheet('noti');
document.getElementById('sMenu').onclick=()=>hgSheet('menu');
const sDot=document.getElementById('sDot'); const dotUp=()=>{ sDot.hidden=HGS.done(); }; dotUp(); HGS.on(dotUp);

gnav.querySelectorAll('button').forEach(b=>b.onclick=()=>{ const g=b.dataset.g;
  if(g==='study'){ goStudy(); return; }
  const f=ensurePlay(); show('play'); const go=()=>{ try{ f.contentWindow.navGo(g); }catch(e){} }; if(f.contentWindow&&f.contentWindow.navGo) go(); else f.addEventListener('load',go,{once:true}); });
/* 홈 아래 메뉴 '공부' → 마지막에 공부한 과목(없으면 연산). 과목 바는 공부 화면에서만 보임 */
window.goStudy=()=>{ let k='math'; try{ k=localStorage.getItem('harugongbu-study')||'math'; }catch(e){} show(k); };
/* 과목에서 오는 정답·통과·오답 졸업 알림 → 공통 캐시·XP·오늘 할 일 */
const hgt=document.getElementById('hgt');
function pop(t,coin){ const d=document.createElement('div'); if(coin) d.className='coin'; d.textContent=t; hgt.appendChild(d); while(hgt.children.length>3) hgt.firstChild.remove(); setTimeout(()=>d.remove(),coin?1100:2600); }
function bigStamp(best){ const o=document.createElement('div'); o.className='bstamp'; const c=best?'#C98A00':'#D1352B';
  o.innerHTML=`<div><svg width="180" height="180" viewBox="0 0 100 100"><g transform="rotate(-14 50 50)" fill="none" stroke="${c}"><circle cx="50" cy="50" r="44" stroke-width="5"/><circle cx="50" cy="50" r="36" stroke-width="2"/><path d="M22 56 Q50 62 78 56" stroke-width="2"/></g><g transform="rotate(-14 50 50)" fill="${c}" font-family="'Noto Sans KR',sans-serif" font-weight="900" text-anchor="middle"><text x="50" y="${best?50:52}" font-size="${best?24:30}">${best?'최고':'참'}</text><text x="50" y="74" font-size="${best?18:14}">${best?'예요':'잘했어요'}</text></g></svg><b>오늘 할 일 완료!</b><small>꾸미기·게임이 열렸어요</small></div>`;
  document.body.appendChild(o); o.onclick=()=>o.remove(); setTimeout(()=>o.remove(),2600); }
/* 효과음: 파일 없이 브라우저에서 바로 만듦 (마이 > 설정에서 끄기) */
let AC=null;
function sfx(k){ if(HGS.st.sfx===false) return; try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended') AC.resume();
  const t=AC.currentTime+.01, tone=(f,s,d,type,v)=>{ const o=AC.createOscillator(), g=AC.createGain(); o.type=type||'triangle'; o.frequency.setValueAtTime(f,t+s); g.gain.setValueAtTime(.0001,t+s); g.gain.exponentialRampToValueAtTime(v||.2,t+s+.012); g.gain.exponentialRampToValueAtTime(.0001,t+s+d); o.connect(g); g.connect(AC.destination); o.start(t+s); o.stop(t+s+d+.03); };
  if(k==='ok'){ tone(784,0,.11); tone(1175,.08,.2); }
  else if(k==='no'){ tone(196,0,.16,'sawtooth',.07); tone(147,.11,.24,'sawtooth',.07); }
  else if(k==='win'){ [523,659,784,1047].forEach((f,i)=>tone(f,i*.085,.22)); }
}catch(e){} }
window.hgSfx=sfx;
window.addEventListener('message',ev=>{ const m=ev.data; if(!m||typeof m.hg!=='string') return;
  if(!Object.values(made).some(f=>f.contentWindow===ev.source)) return;
  if(m.s!=='typ'){ if(m.hg==='ok') sfx('ok'); else if(m.hg==='no') sfx('no'); else if(m.hg==='pass') sfx('win'); }
  const r=HGS.event(m.hg,m.s); if(r.msg.some(x=>x.includes('오늘 할 일 완료'))){ const d=HGS.day(); bigStamp(d.ok/(d.ok+d.no||1)>=.9); } if(r.gain) pop(`${r.gain>0?'+':'−'}${Math.abs(r.gain)} 캐시`,true); r.msg.forEach(x=>pop(x)); });
/* 알림: 정해 둔 시간(앞뒤 1시간 안)에 하루 한 번 — 앱 안 알림 + 허용했으면 브라우저 알림 */
function fireAlarm(a,test){
  const ts=HGS.tasks(), fin=ts.filter(t=>t.n>=t.goal).length, bt=HGS.backTotal();
  const msg=HGS.done()?'오늘 할 일을 다 했어요! 👍':`오늘 할 일 ${fin}/${ts.length}${bt?` · 밀린 공부 ${bt}문제`:''}`;
  document.querySelectorAll('.alm').forEach(x=>x.remove());
  const o=document.createElement('div'); o.className='alm'; o.setAttribute('role','alertdialog'); o.setAttribute('aria-label','공부 알림');
  o.innerHTML=`<div><span class="bell" aria-hidden="true">⏰</span><b></b><p></p><button class="go">오늘 할 일 보기</button><button class="cl">닫기</button></div>`;
  o.querySelector('b').textContent=(test?'[미리 보기] ':'')+(a.label||'공부할 시간'); o.querySelector('p').textContent=msg;
  o.querySelector('.go').onclick=()=>{ o.remove(); show('play'); }; o.querySelector('.cl').onclick=()=>o.remove();
  document.body.appendChild(o);
  try{ if('Notification' in window&&Notification.permission==='granted') new Notification('하루공부 · '+(a.label||'공부할 시간'),{body:msg}); }catch(e){}
}
window.fireAlarm=fireAlarm;
function checkAlarm(){ const st=HGS.st, t=HGS.dayN(), now=new Date(), cur=now.getHours()*60+now.getMinutes();
  if(!st.fired||st.fired.d!==t) st.fired={d:t,ids:[]};
  (st.alarms||[]).forEach(a=>{ if(!a.on||!a.t) return; const [h,m]=a.t.split(':').map(Number), at=h*60+m;
    if(cur>=at&&cur<at+60&&!st.fired.ids.includes(a.t)){ st.fired.ids.push(a.t); HGS.save(); fireAlarm(a); } }); }
setInterval(checkAlarm,20000); setTimeout(checkAlarm,1500);
let first='play'; try{first=localStorage.getItem('harugongbu-subject')||'play';}catch(e){}
ensurePlay(); show(first); navNums();
/* 로그인 흐름 (시안): 로그인 → 학생 고르기 → 홈. 실제 인증 연결은 개발 단계 */
const AKEY='harugongbu-auth', auth=document.getElementById('auth');
let AU=null; try{ AU=JSON.parse(localStorage.getItem(AKEY)); }catch(e){}
const saveAU=()=>{ try{ localStorage.setItem(AKEY,JSON.stringify(AU)); }catch(e){} };
function aview(v){ auth.querySelectorAll('.as').forEach(x=>x.hidden=x.dataset.v!==v); auth.querySelectorAll('.aerr').forEach(e=>e.textContent=''); auth.scrollTop=0;
  if(v==='kids') drawKids(); setTimeout(()=>{ const f=auth.querySelector(`.as[data-v="${v}"] input, .as[data-v="${v}"] .kid`); if(f) f.focus(); },30); }
function drawKids(){ const ks=(AU&&AU.kids)||[{name:HGS.st.name||'민왕이',grade:'초5'}];
  document.getElementById('kids').innerHTML=ks.map((k,i)=>`<button class="kid" data-k="${i}"><span class="kav">${k.name[0]}</span><b>${k.name}</b><small>${k.grade}</small></button>`).join('');
  document.querySelectorAll('.kid').forEach(b=>b.onclick=()=>{ const k=ks[+b.dataset.k]; HGS.st.name=k.name; HGS.save(); AU.kid=+b.dataset.k; saveAU(); auth.hidden=true; ensurePlay(); show('play'); pop(`${k.name}, 오늘도 화이팅!`); }); }
const okEmail=v=>/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);
auth.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>aview(b.dataset.go));
document.getElementById('fLogin').onsubmit=e=>{ e.preventDefault(); const em=lEmail.value.trim(), pw=lPw.value, er=document.getElementById('lErr');
  if(!okEmail(em)){ er.textContent='이메일을 확인해 주세요'; lEmail.focus(); return; }
  if(pw.length<8){ er.textContent='비밀번호는 8자 이상이에요'; lPw.focus(); return; }
  AU={email:em,via:'email',kids:(AU&&AU.kids)||[{name:HGS.st.name||'민왕이',grade:'초5'}]}; saveAU(); aview('kids'); };
auth.querySelectorAll('[data-sns]').forEach(b=>b.onclick=()=>{ AU={email:b.dataset.sns+' 계정',via:b.dataset.sns,kids:(AU&&AU.kids)||[{name:HGS.st.name||'민왕이',grade:'초5'}]}; saveAU(); aview('kids'); });
const tAll=document.getElementById('tAll'), tAllBoxes=()=>auth.querySelectorAll('.tReq,.tOpt');
tAll.onchange=()=>tAllBoxes().forEach(c=>c.checked=tAll.checked);
tAllBoxes().forEach(c=>c.onchange=()=>{ tAll.checked=[...tAllBoxes()].every(x=>x.checked); });
document.getElementById('fSign').onsubmit=e=>{ e.preventDefault(); const er=document.getElementById('sErr'), em=sEmail.value.trim(), pw=sPw.value, kid=sKid.value.trim();
  if(!okEmail(em)){ er.textContent='보호자 이메일을 확인해 주세요'; return; }
  if(!/^(?=.*[A-Za-z])(?=.*\d).{8,}$/.test(pw)){ er.textContent='비밀번호는 영문과 숫자를 섞어 8자 이상이에요'; return; }
  if(!/^[가-힣a-zA-Z0-9]{2,8}$/.test(kid)){ er.textContent='아이 이름은 한글·영문·숫자 2~8자예요'; return; }
  if([...auth.querySelectorAll('.tReq')].some(c=>!c.checked)){ er.textContent='필수 약관에 모두 동의해 주세요'; return; }
  AU={email:em,via:'email',kids:[{name:kid,grade:sGrade.value}],code:sCode.value.trim().toUpperCase()||null}; saveAU(); aview('kids'); };
document.getElementById('fFind').onsubmit=e=>{ e.preventDefault(); const er=document.getElementById('fErr');
  if(!okEmail(fEmail.value.trim())){ er.textContent='이메일을 확인해 주세요'; return; } pop('재설정 링크를 보냈어요 (시연)'); aview('login'); };
document.getElementById('fCode').onsubmit=e=>{ e.preventDefault(); const v=cCode.value.trim().toUpperCase(), er=document.getElementById('cErr');
  if(!/^[A-Z0-9]{6,8}$/.test(v)){ er.textContent='코드는 영문·숫자 6~8자예요'; return; } sCode.value=v; aview('signup'); pop('코드를 확인했어요. 가입을 마치면 적용돼요'); };
document.getElementById('kidAdd').onclick=()=>{ const k=document.getElementById('kids'); if(k.querySelector('.kidf')) return;
  k.insertAdjacentHTML('beforeend',`<form class="af kidf" style="grid-column:1/-1;margin-top:6px"><div class="arow2"><label class="afl"><span>학생 이름</span><input id="kN" maxlength="8" placeholder="2~8자"></label><label class="afl"><span>학년</span><select id="kG">${['초1','초2','초3','초4','초5','초6','중1','중2','중3','고1','고2','고3'].map(g=>`<option>${g}</option>`).join('')}</select></label></div><p class="aerr" id="kE"></p><button class="abtn k" type="submit">추가</button></form>`);
  const f=k.querySelector('.kidf'); f.querySelector('#kN').focus();
  f.onsubmit=e=>{ e.preventDefault(); const n=f.querySelector('#kN').value.trim(); if(!/^[가-힣a-zA-Z0-9]{2,8}$/.test(n)){ f.querySelector('#kE').textContent='한글·영문·숫자 2~8자예요'; return; }
    AU.kids.push({name:n,grade:f.querySelector('#kG').value}); saveAU(); drawKids(); }; };
window.hgLogout=()=>{ AU=null; try{ localStorage.removeItem(AKEY); }catch(e){} lPw.value=''; auth.hidden=false; aview('login'); };
if(!AU){ auth.hidden=false; aview('login'); }

</script></body></html>
