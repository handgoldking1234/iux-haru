<title>하루공부 관리자</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
/* 레이아웃: 왼쪽 메뉴 + 상단 기간 바 + 요약 카드 → 차트 → 표. 데스크톱 우선, 최대 1440px. 앱 UI 규칙(흰 바탕·잉크 #1E2421·배경만 있는 알약)을 따름 */
:root{
  --bg:#F6F7F9; --panel:#FFFFFF; --ink:#1E2421; --sub:#5B6169; --mute:#8A9099; --line:#E6E8EC; --chip:#F1F3F6;
  --accent:#DB2777; --accent-soft:#FDE7F1;
  --good:#16A34A; --good-soft:#E8F7EE; --warn:#D97706; --warn-soft:#FDF3E2; --bad:#E5484D; --bad-soft:#FDECEC;
  --c-math:#2563EB; --c-hanja:#C2410C; --c-eng:#7C3AED; --c-kor:#0B8A5F; --c-sci:#4F46E5; --c-hist:#8B5A2B; --c-typ:#0E7490;
  --font:'Noto Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#121416;--panel:#1A1D20;--ink:#ECEEF0;--sub:#B3B8BF;--mute:#868C94;--line:#2B2F34;--chip:#24282C;--accent:#F0559A;--accent-soft:#3A1C2A;--good:#34C26C;--good-soft:#173322;--warn:#F0A43A;--warn-soft:#3A2B14;--bad:#F2676B;--bad-soft:#3B1D1E;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121416;--panel:#1A1D20;--ink:#ECEEF0;--sub:#B3B8BF;--mute:#868C94;--line:#2B2F34;--chip:#24282C;--accent:#F0559A;--accent-soft:#3A1C2A;--good:#34C26C;--good-soft:#173322;--warn:#F0A43A;--warn-soft:#3A2B14;--bad:#F2676B;--bad-soft:#3B1D1E;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.ic{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.shell{display:grid;grid-template-columns:232px 1fr;min-height:100%;max-width:1440px;margin:0 auto}
.side{position:sticky;top:0;height:100vh;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 12px;gap:4px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 16px}
.brand b{font-size:17px;font-weight:900;letter-spacing:-.2px}
.brand small{display:block;font-size:11.5px;color:var(--mute);font-weight:700}
.logo{width:32px;height:32px;border-radius:10px;background:var(--ink);color:var(--panel);display:grid;place-items:center;font-weight:900;font-size:15px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;height:40px;padding:0 12px;border:0;border-radius:10px;background:none;color:var(--sub);font-weight:700;cursor:pointer;text-align:left}
.nav button:hover{background:var(--chip);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--ink);color:var(--panel)}
.nav em{margin-left:auto;font-style:normal;font-size:11.5px;font-weight:900;background:var(--bad);color:#fff;border-radius:99px;padding:1px 7px}
.nav .grp{font-size:11px;font-weight:900;color:var(--mute);letter-spacing:.06em;padding:14px 12px 4px}
.theme{margin-top:auto;padding:12px 6px 4px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.theme>span{font-size:11px;font-weight:900;color:var(--mute);letter-spacing:.06em;padding:0 6px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:3px;border-radius:10px;background:var(--chip)}
.seg button{display:flex;align-items:center;justify-content:center;gap:3px;height:32px;padding:0 2px;border:0;border-radius:8px;background:none;color:var(--sub);font-weight:800;font-size:12px;cursor:pointer;white-space:nowrap;min-width:0}
.seg button .ic{width:14px;height:14px}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.me{display:flex;align-items:center;gap:10px;height:40px;padding:0 10px 0 4px;border:0;border-radius:99px;background:none;cursor:pointer;color:var(--ink);text-align:left}
.mew{position:relative}
.me[aria-expanded="true"]{background:var(--chip)}
.pop{position:absolute;right:0;top:calc(100% + 8px);width:300px;max-width:calc(100vw - 32px);background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:0 12px 32px rgba(10,12,14,.14);padding:14px;z-index:15;display:flex;flex-direction:column;gap:12px}
.pop .ph2{display:flex;gap:12px;align-items:center}
.pop .av.lg{width:44px;height:44px;font-size:18px}
.pop .ph2 b{display:block;font-size:15px}.pop .ph2 small{color:var(--mute);font-size:12.5px}
.pop .kv{grid-template-columns:96px 1fr;font-size:12.5px}
.pop .ml{display:flex;flex-direction:column;border-top:1px solid var(--line);padding-top:6px}
.pop .ml button{display:flex;align-items:center;gap:10px;height:38px;padding:0 8px;border:0;border-radius:10px;background:none;color:var(--ink);font-weight:700;cursor:pointer;text-align:left}
.pop .ml button:hover{background:var(--chip)}
.pop .ml button.out{color:var(--bad)}
/* 로그인 */
.login{position:fixed;inset:0;z-index:50;background:var(--bg);display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));overflow-y:auto}
.lbox{width:100%;max-width:400px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:28px 26px;display:flex;flex-direction:column;gap:16px}
.lbox .brand{padding:0}
.lbox h2{margin:0;font-size:21px;font-weight:900;letter-spacing:-.3px}
.lbox p{margin:0;color:var(--sub);font-size:13.5px}
.lf{display:flex;flex-direction:column;gap:12px}
.lf label{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:800;color:var(--sub)}
.lf input{height:46px;border:1px solid var(--line);border-radius:12px;padding:0 14px;background:var(--panel);font-size:15px;color:var(--ink)}
.lf input:focus{outline:none;border-color:var(--ink)}
.lf .btn{height:48px;justify-content:center;font-size:15px}
.err{color:var(--bad);font-size:13px;font-weight:700;min-height:18px}
.otp{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.otp input{height:54px;min-width:0;width:100%;text-align:center;font-size:22px;font-weight:900;padding:0}
.lbox{min-width:0}
.lfoot{display:flex;justify-content:space-between;font-size:12.5px;color:var(--mute)}
.lfoot button{border:0;background:none;color:var(--sub);font-weight:800;cursor:pointer;padding:0;text-decoration:underline}
.shell[hidden]{display:none!important}
.me:hover{background:var(--chip)}
.av{width:32px;height:32px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:900}
.me b{font-size:13px}.me small{display:block;color:var(--mute);font-size:11.5px}

.main{min-width:0;padding-block:20px 48px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top h1{margin:0;font-size:22px;font-weight:900;letter-spacing:-.3px;text-wrap:balance}
.top .sp{flex:1}
.demo{font-size:12px;font-weight:800;color:var(--warn);background:var(--warn-soft);border-radius:99px;padding:3px 10px}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pills button{height:34px;padding:0 13px;border:0;border-radius:99px;background:var(--chip);color:var(--sub);font-weight:800;cursor:pointer}
.pills button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.btn{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border:0;border-radius:10px;background:var(--chip);color:var(--ink);font-weight:800;cursor:pointer;white-space:nowrap}
.btn.dark{background:var(--ink);color:var(--panel)}
.btn.bad{background:var(--bad-soft);color:var(--bad)}
.btn .ic{width:16px;height:16px}
.mtop{display:none}

.grid{display:grid;gap:14px}
.k8{grid-template-columns:repeat(4,minmax(0,1fr))}
.c2{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.c11{grid-template-columns:repeat(2,minmax(0,1fr))}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 18px;min-width:0}
.ph{display:flex;align-items:baseline;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.ph h2{margin:0;font-size:15px;font-weight:900}
.ph small{color:var(--mute);font-size:12.5px}
.ph .sp{flex:1}

.kpi{display:flex;flex-direction:column;gap:4px}
.kpi .lab{font-size:12.5px;font-weight:800;color:var(--sub);display:flex;align-items:center;gap:6px}
.kpi .val{font-size:26px;font-weight:900;letter-spacing:-.5px;line-height:1.2}
.kpi .val small{font-size:14px;font-weight:700;color:var(--sub);margin-left:2px}
.kpi .dl{font-size:12.5px;font-weight:800;display:flex;gap:6px;align-items:center;color:var(--mute)}
.up{color:var(--good)}.down{color:var(--bad)}
.kpi.hero{background:var(--accent-soft);border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.kpi.hero .lab{color:var(--accent)}
.kpi .spark{height:28px;margin-top:2px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:800;border-radius:99px;padding:2px 8px;white-space:nowrap}
.tag.good{background:var(--good-soft);color:var(--good)}.tag.warn{background:var(--warn-soft);color:var(--warn)}.tag.bad{background:var(--bad-soft);color:var(--bad)}.tag.mute{background:var(--chip);color:var(--sub)}

svg text{fill:var(--mute);font-size:11px;font-family:var(--font)}
.chart{width:100%;height:auto;display:block}

.tw{overflow-x:auto;margin:0 -4px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:12px;color:var(--mute);font-weight:800;padding:8px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--chip)}
.bar{display:inline-block;height:8px;border-radius:99px;background:var(--accent);vertical-align:middle}
.bar.g{background:var(--mute);opacity:.5}
.coh td.h{text-align:center;font-weight:800;border-radius:6px;border:2px solid var(--panel)}

.alerts{display:flex;flex-direction:column;gap:10px}
.al{display:flex;gap:10px;padding:12px;border-radius:12px;background:var(--bg)}
.al .ic{margin-top:2px}
.al.bad{background:var(--bad-soft)}.al.bad .ic{color:var(--bad)}
.al.warn{background:var(--warn-soft)}.al.warn .ic{color:var(--warn)}
.al b{display:block;font-size:13.5px}.al span{font-size:12.5px;color:var(--sub)}

.funnel{display:flex;flex-direction:column;gap:8px}
.fr{display:grid;grid-template-columns:120px 1fr 92px;gap:10px;align-items:center;font-size:13px}
.fr .fb{height:26px;border-radius:8px;background:var(--accent);opacity:.9}
.fr .fb.l{opacity:.25}
.fr small{color:var(--mute);font-size:12px}

.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.sch{display:flex;align-items:center;gap:8px;height:38px;padding:0 12px;border-radius:10px;background:var(--chip);color:var(--mute);min-width:0;flex:1 1 240px;max-width:360px}
.sch input{border:0;background:none;outline:none;flex:1;min-width:0;color:var(--ink)}
select{height:38px;border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:0 10px}

.drawer{position:fixed;inset:0;z-index:20;display:flex;justify-content:flex-end}
.drawer .dim{position:absolute;inset:0;background:rgba(10,12,14,.45)}
.drawer .dp{position:relative;width:min(560px,100%);height:100%;overflow-y:auto;background:var(--panel);padding:20px 22px calc(28px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
.dh{display:flex;align-items:center;gap:10px}
.dh h3{margin:0;font-size:18px;font-weight:900}
.dh .sp{flex:1}
.ib{width:36px;height:36px;border:0;border-radius:10px;background:var(--chip);display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.kv{display:grid;grid-template-columns:120px 1fr;gap:6px 12px;font-size:13px}
.kv dt{color:var(--mute);font-weight:700}.kv dd{margin:0;font-weight:700;min-width:0;overflow-wrap:anywhere}
.kid{border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.kid h4{margin:0;font-size:15px;display:flex;gap:8px;align-items:center}
.prog{display:grid;grid-template-columns:62px 1fr 92px;gap:8px;align-items:center;font-size:12.5px}
.prog i{height:8px;border-radius:99px;background:var(--chip);overflow:hidden;display:block}
.prog i b{display:block;height:100%;border-radius:99px}
.cal{display:grid;grid-template-columns:repeat(15,1fr);gap:3px}
.cal span{aspect-ratio:1;border-radius:4px;background:var(--chip)}
.cal span.l1{background:color-mix(in srgb,var(--good) 35%,var(--chip))}.cal span.l2{background:color-mix(in srgb,var(--good) 70%,var(--chip))}.cal span.l3{background:var(--good)}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.confirm{background:var(--bad-soft);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;font-size:13px}
.confirm textarea{width:100%;min-height:60px;border:1px solid var(--line);border-radius:10px;padding:8px;background:var(--panel)}

.queue{display:flex;flex-direction:column;gap:6px}
.qi{display:flex;flex-direction:column;gap:2px;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:10px 12px;cursor:pointer}
.qi[aria-selected="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.qi b{font-size:13.5px}.qi small{color:var(--mute);font-size:12px}
.form{display:flex;flex-direction:column;gap:10px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:800;color:var(--sub)}
.form input,.form textarea{border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:var(--panel);font-weight:500;color:var(--ink)}
.form textarea{min-height:64px;resize:vertical}
.card{border:1.5px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;max-width:340px;margin:0 auto;width:100%}
.card .w{font-size:30px;font-weight:900}
.card .m{font-size:15px;font-weight:800}
.card .bx{align-self:stretch;text-align:left;background:var(--bg);border-radius:12px;padding:10px 12px;font-size:13px;color:var(--sub)}
.note{font-size:12.5px;color:var(--mute)}
.ok{color:var(--good);font-weight:800;font-size:13px}
.dist{display:flex;height:10px;border-radius:99px;overflow:hidden;width:140px;background:var(--chip)}
.dist i{display:block;height:100%}
.empty{padding:28px;text-align:center;color:var(--sub);border:1px dashed var(--line);border-radius:14px}
ul.plain{margin:0;padding-left:18px;color:var(--sub);display:flex;flex-direction:column;gap:4px}

@media (max-width:1180px){.k8{grid-template-columns:repeat(2,minmax(0,1fr))}.c2,.c3{grid-template-columns:minmax(0,1fr)}}
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;inset:0 auto 0 0;width:260px;z-index:30;transform:translateX(-100%);transition:transform .2s;padding-top:calc(18px + env(safe-area-inset-top,0px))}
  .side.open{transform:none;box-shadow:0 0 0 100vmax rgba(10,12,14,.45)}
  .mtop{display:flex;align-items:center;gap:10px}
  .main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 40px}
  .c11{grid-template-columns:minmax(0,1fr)}
  .fr{grid-template-columns:92px 1fr 70px}
}
@media (max-width:860px){.main{position:relative}.top .me span:last-child{display:none}.top .me{padding:0;height:36px}.top .mew{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px))}}
@media (max-width:480px){.k8{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.kpi .val{font-size:22px}.top h1{font-size:19px}}
/* 차트 애니메이션: 화면이 열릴 때 막대가 자라고 선이 그려지고 숫자가 올라감 */
@keyframes gy{from{transform:scaleY(0)}}
@keyframes gx{from{transform:scaleX(0)}}
@keyframes draw{from{stroke-dashoffset:1000}to{stroke-dashoffset:0}}
@keyframes pop{from{opacity:0;transform:scale(.92)}}
.gy{transform-box:fill-box;transform-origin:50% 100%;animation:gy .7s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 40ms)}
.gx{transform-origin:0 50%;animation:gx .8s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 50ms)}
.spark polyline{stroke-dasharray:1000;animation:draw 1.2s ease-out both}
.coh td.h{animation:pop .45s ease-out both;animation-delay:calc(var(--i,0) * 25ms)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="login" id="login">
  <div class="lbox">
    <div class="brand"><span class="logo">하</span><span><b>하루공부</b><small>관리자</small></span></div>
    <form class="lf" id="lf1" novalidate>
      <div><h2>관리자 로그인</h2><p>관리자로 등록된 계정만 들어올 수 있어요.</p></div>
      <label>이메일<input id="lEmail" type="email" autocomplete="username" placeholder="name@akiaka.com" value="handgoldking@akiaka.com"></label>
      <label>비밀번호<input id="lPw" type="password" autocomplete="current-password" placeholder="비밀번호"></label>
      <div class="err" id="lErr1" aria-live="polite"></div>
      <button class="btn dark" type="submit">로그인</button>
      <div class="lfoot"><span>시안: 아무 비밀번호나 4자 이상</span><button type="button">비밀번호를 잊었어요</button></div>
    </form>
    <form class="lf" id="lf2" novalidate hidden>
      <div><h2>2단계 인증</h2><p>인증 앱에 표시된 6자리 숫자를 넣어 주세요.</p></div>
      <div class="otp" id="otp"><input inputmode="numeric" maxlength="1" aria-label="1번째 숫자" id="o0"><input inputmode="numeric" maxlength="1" aria-label="2번째 숫자" id="o1"><input inputmode="numeric" maxlength="1" aria-label="3번째 숫자" id="o2"><input inputmode="numeric" maxlength="1" aria-label="4번째 숫자" id="o3"><input inputmode="numeric" maxlength="1" aria-label="5번째 숫자" id="o4"><input inputmode="numeric" maxlength="1" aria-label="6번째 숫자" id="o5"></div>
      <div class="err" id="lErr2" aria-live="polite"></div>
      <button class="btn dark" type="submit">인증하고 들어가기</button>
      <div class="lfoot"><span>시안: 아무 숫자 6자리</span><button type="button" id="lBack">다른 계정으로</button></div>
    </form>
  </div>
</div>
<div class="shell" id="shellEl" hidden>
  <aside class="side" id="side" aria-label="관리자 메뉴">

const TITLE={game:'게임 이용',dash:'대시보드',acq:'유입 분석',users:'회원',learn:'학습 분석',cms:'콘텐츠',cs:'고객지원',reward:'보상·게임',pay:'결제·구독',sys:'관리자·권한'};
const nav=document.getElementById('nav'), view=document.getElementById('view'), drawer=document.getElementById('drawer'), dp=document.getElementById('dp'), side=document.getElementById('side');
function countUp(root){ if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  root.querySelectorAll('.kpi .val').forEach(el=>{ const t=el.firstChild; if(!t||t.nodeType!==3) return; const raw=t.nodeValue, m=raw.match(/^([\d,]+(?:\.\d+)?)(.*)$/); if(!m) return;
    const target=parseFloat(m[1].replace(/,/g,'')), dec=(m[1].split('.')[1]||'').length, comma=m[1].includes(','), rest=m[2], t0=performance.now(), dur=900;
    const f=v=>{ let x=v.toFixed(dec); if(comma||target>=1000) x=Number(x).toLocaleString('ko-KR',{minimumFractionDigits:dec,maximumFractionDigits:dec}); return x+rest; };
    const step=now=>{ const k=Math.min(1,(now-t0)/dur), e=1-Math.pow(1-k,3); t.nodeValue=f(target*e); if(k<1) requestAnimationFrame(step); else t.nodeValue=raw; }; t.nodeValue=f(0); requestAnimationFrame(step); }); }
function render(){ nav.innerHTML=navHTML(); document.getElementById('title').textContent=TITLE[cur]; seed=7+cur.length; view.innerHTML=`<div class="grid" style="gap:14px">${V[cur]()}</div>`; countUp(view);
  document.getElementById('range').style.visibility=['dash','acq','learn','game'].includes(cur)?'visible':'hidden';
  try{ localStorage.setItem('hg-admin-view',cur); }catch(e){} }
nav.addEventListener('click',e=>{ const b=e.target.closest('[data-v]'); if(!b) return; cur=b.dataset.v; side.classList.remove('open'); render(); window.scrollTo(0,0); });
document.getElementById('menuBtn').onclick=()=>side.classList.add('open');
side.addEventListener('click',e=>{ if(e.target===side) side.classList.remove('open'); });
document.getElementById('range').addEventListener('click',e=>{ const b=e.target.closest('[data-r]'); if(!b) return; range=+b.dataset.r; document.querySelectorAll('#range button').forEach(x=>x.setAttribute('aria-pressed',String(x===b))); render(); });
view.addEventListener('click',e=>{ const tr=e.target.closest('[data-m]'); if(tr){ memberDrawer(tr.dataset.m); return; }
  const q=e.target.closest('[data-rep]'); if(q){ repSel=q.dataset.rep; render(); return; }
  const pb=e.target.closest('.pills button'); if(pb&&!pb.closest('#range')){ pb.parentNode.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===pb))); } });
view.addEventListener('keydown',e=>{ if(e.key==='Enter'){ const tr=e.target.closest('[data-m]'); if(tr) memberDrawer(tr.dataset.m); } });
view.addEventListener('input',e=>{ if(e.target.id==='q'){ const s=e.target.value.trim().toLowerCase(); document.getElementById('memRows').innerHTML=memRows(MEM.filter(m=>!s||m.email.includes(s)||m.kids.join(' ').toLowerCase().includes(s)||m.id.toLowerCase().includes(s))); }
  if(e.target.id&&e.target.id.startsWith('f_')){ const k=e.target.id.slice(2); const el=document.getElementById('pv_'+k); if(el) el.textContent=e.target.value; } });
view.addEventListener('submit',e=>{ if(e.target.id==='cmsForm'){ e.preventDefault(); document.getElementById('saved').hidden=false; } });
drawer.addEventListener('click',e=>{ if(e.target.closest('[data-close]')){ drawer.hidden=true; return; }
  if(e.target.closest('#reveal')){ const b=e.target.closest('#reveal'); b.parentNode.firstChild.textContent='kimminwang@naver.com '; b.outerHTML='<span class="tag warn">열람 기록됨</span>'; return; }
  const a=e.target.closest('[data-act]'); if(a){ const box=document.getElementById('actBox'); const t={cash:['캐시 보정','보정할 캐시와 사유를 적어 주세요.','보정하기'],ban:['계정 정지','정지하면 보호자와 자녀 모두 로그인할 수 없어요. 사유를 적어 주세요.','정지하기'],del:['탈퇴 처리','바로 비활성화하고 30일 뒤 개인정보를 파기해요. 결제 기록은 법정 기간 동안 보관해요.','탈퇴 처리하기']}[a.dataset.act];
    box.innerHTML=`<div class="confirm"><b>${t[0]}</b><span>${t[1]}</span><textarea aria-label="사유" placeholder="사유 (필수)"></textarea><div class="acts"><button class="btn bad" data-done>${t[2]}</button><button class="btn" data-cancel>취소</button></div></div>`; return; }
  if(e.target.closest('[data-cancel]')){ document.getElementById('actBox').innerHTML=''; return; }
  if(e.target.closest('[data-done]')){ const ta=document.querySelector('#actBox textarea'); if(!ta.value.trim()){ ta.placeholder='사유를 적어야 진행할 수 있어요'; ta.focus(); return; } document.getElementById('actBox').innerHTML='<p class="ok">처리했어요. 감사 로그에 남겼어요.</p>'; } });
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ drawer.hidden=true; side.classList.remove('open'); mePop.hidden=true; meBtn.setAttribute('aria-expanded','false'); } });
let wasN=NARROW(); addEventListener('resize',()=>{ if(NARROW()!==wasN){ wasN=NARROW(); render(); } });
/* 로그인 (시안: 실제 인증은 Supabase Auth + 관리자 역할 + 2단계 인증) */
const loginEl=document.getElementById('login'), shellEl=document.getElementById('shellEl'), lf1=document.getElementById('lf1'), lf2=document.getElementById('lf2'), otps=[...document.querySelectorAll('#otp input')];
function enter(){ loginEl.hidden=true; shellEl.hidden=false; const n=new Date(); document.getElementById('meNow').textContent=`${n.getMonth()+1}/${n.getDate()} ${String(n.getHours()).padStart(2,'0')}:${String(n.getMinutes()).padStart(2,'0')}`; try{ sessionStorage.setItem('hg-admin-auth','1'); }catch(e){} render(); }
function logout(){ try{ sessionStorage.removeItem('hg-admin-auth'); }catch(e){} mePop.hidden=true; meBtn.setAttribute('aria-expanded','false'); shellEl.hidden=true; loginEl.hidden=false; lf2.hidden=true; lf1.hidden=false; document.getElementById('lPw').value=''; document.getElementById('lPw').focus(); }
lf1.addEventListener('submit',e=>{ e.preventDefault(); const em=document.getElementById('lEmail').value.trim(), pw=document.getElementById('lPw').value, er=document.getElementById('lErr1');
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){ er.textContent='이메일 주소를 확인해 주세요.'; return; }
  if(pw.length<4){ er.textContent='비밀번호를 4자 이상 넣어 주세요.'; return; }
  er.textContent=''; document.getElementById('meMail').textContent=em; lf1.hidden=true; lf2.hidden=false; otps.forEach(o=>o.value=''); otps[0].focus(); });
otps.forEach((o,i)=>{ o.addEventListener('input',()=>{ o.value=o.value.replace(/\D/g,'').slice(-1); if(o.value&&i<5) otps[i+1].focus(); if(otps.every(x=>x.value)) lf2.requestSubmit(); });
  o.addEventListener('keydown',e=>{ if(e.key==='Backspace'&&!o.value&&i>0) otps[i-1].focus(); });
  o.addEventListener('paste',e=>{ const t=(e.clipboardData.getData('text')||'').replace(/\D/g,'').slice(0,6); if(t.length){ e.preventDefault(); t.split('').forEach((c,j)=>otps[j].value=c); otps[Math.min(5,t.length)].focus(); if(t.length===6) lf2.requestSubmit(); } }); });
lf2.addEventListener('submit',e=>{ e.preventDefault(); const code=otps.map(o=>o.value).join(''); if(code.length<6){ document.getElementById('lErr2').textContent='6자리를 모두 넣어 주세요.'; return; } document.getElementById('lErr2').textContent=''; enter(); });
document.getElementById('lBack').onclick=()=>{ lf2.hidden=true; lf1.hidden=false; };
/* 오른쪽 위 내 계정 */
const meBtn=document.getElementById('meBtn'), mePop=document.getElementById('mePop');
meBtn.addEventListener('click',e=>{ e.stopPropagation(); const o=mePop.hidden; mePop.hidden=!o; meBtn.setAttribute('aria-expanded',String(o)); });
document.addEventListener('click',e=>{ if(!mePop.hidden&&!e.target.closest('.mew')){ mePop.hidden=true; meBtn.setAttribute('aria-expanded','false'); } });
mePop.addEventListener('click',e=>{ const b=e.target.closest('[data-me]'); if(!b) return; const a=b.dataset.me; mePop.hidden=true; meBtn.setAttribute('aria-expanded','false');
  if(a==='out') logout(); else if(a==='sys'){ cur='sys'; render(); } else if(a==='pw'){ cur='sys'; render(); } });
const thEl=document.getElementById('theme');
function setTheme(t){ if(t==='system') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme',t);
  thEl.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.t===t))); try{ localStorage.setItem('hg-admin-theme',t); }catch(e){} }
thEl.addEventListener('click',e=>{ const b=e.target.closest('[data-t]'); if(b) setTheme(b.dataset.t); });
let th0='system'; try{ th0=localStorage.getItem('hg-admin-theme')||'system'; }catch(e){} setTheme(th0);
try{ const v=localStorage.getItem('hg-admin-view'); if(v&&TITLE[v]) cur=v; }catch(e){}
let au=false; try{ au=sessionStorage.getItem('hg-admin-auth')==='1'; }catch(e){} if(au) enter(); else { loginEl.hidden=false; shellEl.hidden=true; }
</script>
